# Dev stack for the anaerobic-chamber dashboard.
#
#   docker compose up -d         # start web + broker
#   docker compose up -d web     # web dashboard only
#   docker compose down          # stop everything
#
# After start: open http://localhost:8080 (or :8080/?demo for mock data).
# The ESP32 publishes to mqtt://<this-host>:1883; the browser subscribes
# over WebSockets at ws://<this-host>:9001.

services:
  web:
    build: ./web
    image: anaerobic-chamber-web:latest
    container_name: anaerobic-web
    ports:
      - "8080:80"
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: anaerobic-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  collector:
    build: ./collector
    image: anaerobic-chamber-collector:latest
    container_name: anaerobic-collector
    depends_on:
      - mqtt
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: "1883"
    ports:
      - "8000:8000"   # templates HTTP API
    volumes:
      - ./collector/data:/data
    restart: unless-stopped

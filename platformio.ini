; Anaerobic Chamber Control System
; PlatformIO multi-environment configuration

[platformio]
default_envs = mega
src_dir = .

; --- Arduino Mega 2560 (main controller) ---
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<firmware/mega/src/>
    +<firmware/mega/src/**>
lib_deps =
    olikraus/U8g2 @ ^2.35.19
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.9.0
    bblanchon/ArduinoJson @ ^7.1.0
    phzi/DFRobot_MultiGasSensor @ ^2.0.0
    dfrobot/DFRobot_ENS160 @ ^1.0.1
    arduino-libraries/SD @ ^1.3.0

; --- Hardware Discovery Helper ---
[env:discovery]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<helpers/hardware_discovery.cpp>
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.9.0

; --- Arduino Nano ESP32 (WiFi/MQTT bridge) ---
[env:esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
upload_protocol = esptool
; upload_port = /dev/ttyACM0   ; uncomment and set if auto-detection fails
monitor_speed = 115200
build_src_filter =
    -<*>
    +<firmware/esp32/src/>
    +<firmware/esp32/src/**>
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
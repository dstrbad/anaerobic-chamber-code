# Mosquitto config for the anaerobic-chamber dev stack.
# - Native MQTT on 1883 for the ESP32 and the Python collector
# - MQTT-over-WebSockets on 9001 for the browser dashboard
# Anonymous access is fine here because the broker only listens on the local
# Docker network plus localhost-bound published ports. Lock this down before
# any deployment beyond a dev workstation.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
persistence false
